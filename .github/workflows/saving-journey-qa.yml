name: Saving journey simulator verification
on:
  push:
    branches: [qa/pipo-saving-journeys]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run saving tests on an installed iPhone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          if test -d /Applications/Xcode_16.4.app; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devices"]; print(next(d["udid"] for k in sorted(ds,key=lambda k:(k.endswith("iOS-18-5"),k),reverse=True) for d in ds[k] if d["name"].startswith("iPhone 16")))')
          echo "DEVICE=$id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$id" -b
          xcrun simctl status_bar "$id" override --time 9:41
          xcodebuild -scheme Pipo -derivedDataPath /tmp/PipoSaving -destination "platform=iOS Simulator,id=$id" -parallel-testing-enabled NO -only-testing:PipoTests/GroupPlanJourneyTests -only-testing:PipoTests/GroupSavingManagerTests -only-testing:PipoTests/PersonalGoalTests CODE_SIGN_IDENTITY=- test > /tmp/saving.log 2>&1 || { grep -E 'error:|failed|warning:' /tmp/saving.log | tail -60; exit 1; }
          grep -E 'Executed [0-9]+ tests|TEST SUCCEEDED' /tmp/saving.log | tail -6 | tee proof/results.txt
          dir=$(xcrun simctl get_app_container "$id" com.pipo.app data)
          cp "$dir"/Documents/SavingCaptures/*.png proof/
      - uses: actions/upload-artifact@v4
        with:
          name: saving-native-captures
          path: proof/
      - name: Drive both saving journeys from Home with system Reduce Motion
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/prepare-ui.py
          xcrun simctl spawn "$DEVICE" defaults write com.apple.Accessibility ReduceMotionEnabled -bool YES
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -scheme Pipo -derivedDataPath /tmp/PipoSaving -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath /tmp/SavingUI.xcresult -parallel-testing-enabled NO -only-testing:PipoTests/SavingFlowUITests CODE_SIGN_IDENTITY=- test > /tmp/ui.log 2>&1 || { tail -65 /tmp/ui.log; exit 1; }
          grep -E 'Executed [0-9]+ tests|TEST SUCCEEDED' /tmp/ui.log | tail -4 | tee proof/ui-results.txt
          dir=$(xcrun simctl get_app_container "$DEVICE" com.pipo.app data)
          cat "$dir/Documents/saving-reduce-motion.txt" | tee proof/reduce-motion.txt
          test "$(cat proof/reduce-motion.txt)" = true
      - name: Collect UI test attachments
        if: always()
        run: |
          if test -d /tmp/SavingUI.xcresult; then
            xcrun xcresulttool export attachments --path /tmp/SavingUI.xcresult --output-path proof/ui-attachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saving-journey-verification
          path: proof/
