name: Pipo tap preview
on:
  push:
    branches: [preview/pipo-v4-home]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select installed iPhone
        run: |
          set -euo pipefail
          mkdir -p proof
          if test -d /Applications/Xcode_16.4.app; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devices"]; print(next(d["udid"] for k in sorted(ds,key=lambda k:(k.endswith("iOS-18-5"),k),reverse=True) for d in ds[k] if d["name"].startswith("iPhone")))')
          echo "DEVICE=$id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$id" -b
      - name: Prepare a checkout-only UI test of the real Home button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Pipo/App/PipoApp.swift')
          p.write_text(p.read_text().replace('RootView()','RootView(initialAuthState: .authenticated)'))
          p=Path('Pipo/Core/DesignSystem/PipoMascotView.swift');s=p.read_text()
          s=s.replace('poster.isHidden = true','poster.isHidden = true\n        try? Data().write(to: URL.documentsDirectory.appendingPathComponent("ready"))')
          s=s.replace('UIImpactFeedbackGenerator(style: .light).impactOccurred()','UIImpactFeedbackGenerator(style: .light).impactOccurred()\n            try? Data().write(to: URL.documentsDirectory.appendingPathComponent("haptic"))')
          s=s.replace('artwork?.evaluateJavaScript("acknowledgeTap()")','''artwork?.evaluateJavaScript("acknowledgeTap(); String(tapEnd - mascot.getCurrentTime())") { result, _ in
                      if let value = result as? String {
                          try? value.write(to: URL.documentsDirectory.appendingPathComponent("reaction"), atomically: true, encoding: .utf8)
                      }
                  }''')
          p.write_text(s)
          p=Path('Pipo.xcodeproj/project.pbxproj');s=p.read_text().replace('com.apple.product-type.bundle.unit-test','com.apple.product-type.bundle.ui-testing').replace('BUNDLE_LOADER = "$(TEST_HOST)";','TEST_TARGET_NAME = Pipo;').replace('TEST_HOST = "$(BUILT_PRODUCTS_DIR)/Pipo.app/Pipo";','')
          p.write_text(s)
          for p in Path('PipoTests').glob('*.swift'):p.write_text('// Checkout-only UI test target\n')
          Path('PipoTests/PersonalGoalTests.swift').write_text('''import XCTest
          final class TapUITests: XCTestCase {
              @MainActor func testGreetPipo() throws {
                  let app = XCUIApplication()
                  app.launch()
                  let greet = app.buttons["pipo.greet"]
                  XCTAssertTrue(greet.waitForExistence(timeout: 25))
                  XCTAssertEqual(greet.label, "Greet Pipo")
                  XCTAssertTrue(greet.isHittable)
                  let before = XCTAttachment(screenshot: XCUIScreen.main.screenshot())
                  before.name = "Home before greeting"
                  before.lifetime = .keepAlways
                  add(before)
                  Thread.sleep(forTimeInterval: 1)
                  greet.tap()
                  let after = XCTAttachment(screenshot: XCUIScreen.main.screenshot())
                  after.name = "Home after greeting"
                  after.lifetime = .keepAlways
                  add(after)
                  Thread.sleep(forTimeInterval: 2)
                  XCTAssertTrue(app.buttons["Create a saving goal"].exists)
              }
          }
          ''')
          PY
      - name: Verify the tap on Home
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -scheme Pipo -derivedDataPath /tmp/Pipo -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -maximum-test-execution-time-allowance 120 -test-timeouts-enabled YES -collect-test-diagnostics never -resultBundlePath /tmp/home-result -only-testing:PipoTests/TapUITests CODE_SIGN_IDENTITY=- test > /tmp/normal.log 2>&1 || { tail -55 /tmp/normal.log; exit 1; }
          dir=$(xcrun simctl get_app_container "$DEVICE" com.pipo.app data)
          cp "$dir/Documents/reaction" proof/reaction-seconds.txt
          python3 -c 'assert .65 < float(open("proof/reaction-seconds.txt").read()) <= .91'
          grep 'TEST SUCCEEDED' /tmp/normal.log | tee proof/tests.txt
          xcrun xcresulttool export attachments --path /tmp/home-result.xcresult --output-path proof/captures
      - name: Activate the same button with system Reduce Motion
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl spawn "$DEVICE" defaults write com.apple.Accessibility ReduceMotionEnabled -bool YES
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          dir=$(xcrun simctl get_app_container "$DEVICE" com.pipo.app data)
          rm -f "$dir/Documents/ready" "$dir/Documents/reaction" "$dir/Documents/haptic"
          xcodebuild -scheme Pipo -derivedDataPath /tmp/Pipo -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -only-testing:PipoTests/TapUITests CODE_SIGN_IDENTITY=- test-without-building > /tmp/reduced.log 2>&1 || { tail -40 /tmp/reduced.log; exit 1; }
          dir=$(xcrun simctl get_app_container "$DEVICE" com.pipo.app data)
          test -f "$dir/Documents/haptic"
          test ! -e "$dir/Documents/ready"
          test ! -e "$dir/Documents/reaction"
          echo 'Reduce Motion tap reached haptic path with no web renderer.' >> proof/tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tap-preview
          path: proof/
          retention-days: 3
