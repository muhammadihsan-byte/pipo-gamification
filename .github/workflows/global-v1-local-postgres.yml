name: Global Experience V1 - Disposable Local PostgreSQL QA

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/local_qa/**"
      - "scripts/local_authenticated_global_v1_qa.py"
      - "supabase/proposals/global_v1_goal_currency_immutable_REVIEW_ONLY.sql"
      - "supabase/proposals/issue_42_money_out_ledger_REVIEW_ONLY.sql"
      - "supabase/proposals/issue_29_immutable_contribution_acl_REVIEW_ONLY.sql"
      - "supabase/proposals/issue_80_plan_revision_cas_REVIEW_ONLY.sql"
      - "supabase/proposals/issue_80_budget_cas_v2_REVIEW_ONLY.sql"
      - "supabase/local_qa/test_issue80_budget_cas_v2_STAGING_ONLY.sql"
      - "scripts/local_authenticated_issue80_cas_qa.py"
      - "scripts/local_authenticated_issue80_budget_v2_qa.py"
      - "scripts/test_issue80_concurrent_sessions.py"
      - ".github/workflows/global-v1-local-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-v1-local-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-currency-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pipo_global_v1_local_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pipo_global_v1_local_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: pipo_global_v1_local_qa
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify disposable PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
          psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT CASE WHEN current_setting('server_version_num')::integer >= 170000 THEN 'PASS' ELSE 'FAIL' END" | grep -Fx PASS

      - name: Load deployed Pipo migration into isolated local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/local_qa/bootstrap.sql

      - name: Apply review-only immutable currency guard to disposable database ONLY
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/global_v1_goal_currency_immutable_REVIEW_ONLY.sql

      - name: Assert exact cents, immutable currency, and authenticated two-user RLS
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/local_qa/test_global_v1_currency_rls.sql

      - name: Apply Issue 42 contribution history guard to disposable PostgreSQL ONLY
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/issue_42_money_out_ledger_REVIEW_ONLY.sql

      - name: Reject contribution tampering and allow only identical UUID replay
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/local_qa/test_issue42_immutable_history.sql

      - name: Apply Issue 29 immutable ledger ACL to disposable PostgreSQL ONLY
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/issue_29_immutable_contribution_acl_REVIEW_ONLY.sql

      - name: Verify authenticated A/B ledger ACL, UUID retry and whole-account erasure
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/local_qa/test_issue29_ledger_acl.sql

      - name: Apply Issue 80 CAS proposal in disposable PostgreSQL ONLY
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/issue_80_plan_revision_cas_REVIEW_ONLY.sql

      - name: Validate Issue 80 revisions, retries, authorization and synthetic erasure (ROLLBACK)
        shell: bash
        env:
          PGOPTIONS: "-c pipo.allow_synthetic_auth_qa=staging-only"
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/local_qa/test_issue80_plan_revision_STAGING_ONLY.sql

      - name: Real two-session concurrent CAS with independent committed PostgreSQL connections
        shell: bash
        env:
          PGOPTIONS: "-c pipo.allow_synthetic_auth_qa=staging-only"
        run: |
          set -euo pipefail
          python3 scripts/test_issue80_concurrent_sessions.py

      - name: Install review-only Issue 80 atomic budget CAS V2 on disposable PostgreSQL ONLY
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/issue_80_budget_cas_v2_REVIEW_ONLY.sql

      - name: Validate atomic goal-budget revision, rollback, auth and historical XP
        shell: bash
        env:
          PGOPTIONS: "-c pipo.allow_synthetic_auth_qa=staging-only"
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/local_qa/test_issue80_budget_cas_v2_STAGING_ONLY.sql

      - name: Explicitly report test scope
        if: always()
        shell: bash
        run: |
          echo "LOCAL QA: disposable postgres:17 service on an ephemeral GitHub Linux runner."
          echo "NO Supabase project, database branch, production Auth users, secrets, or billing change."
          echo "Verified by SQL: initial schema, currency guard, RLS, FK, #42 contribution guard, #29 client ACL, #80 plan CAS and Auth deletion cascade."
          echo "NOT VERIFIED: real Auth JWT signing / PostgREST request routing / live Supabase 2-user roundtrip."

  local-auth-postgrest:
    name: Local Supabase real Auth and PostgREST two-user E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.2.0
      - name: Validate local-only runner commands
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase start --help > /dev/null
          supabase status --help > /dev/null
          python3 -m py_compile scripts/local_authenticated_global_v1_qa.py

      - name: Start disposable local Auth + REST stack (no production link)
        shell: bash
        run: |
          set -euo pipefail
          supabase start --exclude studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - name: Authenticate two synthetic users and exercise actual local REST RLS
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          python3 scripts/local_authenticated_global_v1_qa.py

      - name: Signed local Auth A/B CAS, RLS, immutable ledger and retry E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/local_authenticated_issue80_cas_qa.py

      - name: Signed Auth A/B atomic Budget CAS V2 and legacy UPSERT denial on LOCAL ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/local_authenticated_issue80_budget_v2_qa.py

      - name: Explicitly report independent local E2E scope
        if: always()
        shell: bash
        run: |
          echo "Local-only Supabase Auth JWT + PostgREST with disposable +pipoqa accounts."
          echo "All API and database URLs strictly constrained to loopback."
          echo "This does NOT write to deployed Supabase production."
