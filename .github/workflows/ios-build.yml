name: iOS Build and Test

on:
  pull_request:
    branches:
      - main
      - preview/pipo-v4-home
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "Choose fast compilation or full simulator tests"
        type: choice
        required: true
        default: build-only
        options:
          - build-only
          - build-and-test
          - visual-qa
          - onboarding-qa
          - issue42-qa
          - manage-plan-qa
          - global-experience-qa
          - dashboard-a11y-qa
          - first-save-qa
          - spark-goal-qa
          - visual-layout-qa
  push:
    tags:
      - "v*-rc*"

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.event.pull_request.number || github.ref }}
  # Cancel obsolete PR commits, but do not cancel explicitly requested QA or release-tag runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pin one authorized QA run to this exact candidate, never the
          # synthetic PR merge SHA or mutable upstream main.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect Xcode
        run: |
          set -euo pipefail
          if test -d /Applications/Xcode.app/Contents/Developer; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          DEVELOPER_DIR="$(xcode-select -p 2>/dev/null || true)"
          if test -z "$DEVELOPER_DIR" || ! test -d "$DEVELOPER_DIR"; then
            echo "No usable Xcode developer directory is available." >&2
            exit 1
          fi
          xcodebuild -version | tee xcode-version.txt

      - name: Detect canonical Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if test -d Pipo.xcodeproj; then
            XCODE_PROJECT="Pipo.xcodeproj"
            XCODE_SCHEME="Pipo"
          elif test -d SatuSaku.xcodeproj; then
            XCODE_PROJECT="SatuSaku.xcodeproj"
            XCODE_SCHEME="SatuSaku"
          else
            echo "Neither Pipo.xcodeproj nor SatuSaku.xcodeproj is available." >&2
            exit 1
          fi
          {
            echo "XCODE_PROJECT=$XCODE_PROJECT"
            echo "XCODE_SCHEME=$XCODE_SCHEME"
          } >> "$GITHUB_ENV"
          echo "Using project $XCODE_PROJECT with scheme $XCODE_SCHEME"

      - name: P0 static release configuration preflight
        shell: bash
        run: bash scripts/check-p0-release-config.sh

      - name: Select a compatible installed iOS simulator
        if: github.event_name != 'workflow_dispatch' || inputs.validation_mode != 'build-only'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcrun simctl list runtimes available -j > validation/runtimes.json
          xcrun simctl list devices available -j > validation/devices.json
          python3 - <<'PY'
          import json
          import os
          import sys

          with open("validation/runtimes.json") as file:
              runtimes = json.load(file).get("runtimes", [])
          with open("validation/devices.json") as file:
              devices_by_runtime = json.load(file).get("devices", {})

          available_runtimes = {
              runtime["identifier"]
              for runtime in runtimes
              if (
                  runtime.get("isAvailable")
                  and runtime.get("name", "").startswith("iOS ")
                  and ".iOS-" in runtime.get("identifier", "")
              )
          }
          if not available_runtimes:
              raise SystemExit(
                  "No available iOS simulator runtime is installed; "
                  "refusing to provision one."
              )

          preferred_names = ("iPhone 15", "iPhone 16", "iPhone 14", "iPhone 13")
          candidates = []
          for runtime_id, devices in devices_by_runtime.items():
              if runtime_id not in available_runtimes:
                  continue
              for device in devices:
                  if (
                      device.get("isAvailable")
                      and not device.get("availabilityError")
                      and device.get("name", "").startswith("iPhone")
                  ):
                      preference = next(
                          (
                              index
                              for index, name in enumerate(preferred_names)
                              if device["name"] == name
                          ),
                          len(preferred_names),
                      )
                      candidates.append((preference, device["name"], runtime_id, device["udid"]))

          if not candidates:
              raise SystemExit(
                  "No available iPhone simulator matches an installed iOS runtime; "
                  "refusing to create or install one."
              )

          _, name, runtime_id, udid = sorted(candidates)[0]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIMULATOR_NAME={name}\n")
              env.write(f"SIMULATOR_RUNTIME_ID={runtime_id}\n")
              env.write(f"SIMULATOR_UDID={udid}\n")
          print(f"Using existing simulator: {name} ({udid}) on {runtime_id}")
          PY

      - name: Build only for iOS Simulator
        if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'build-only'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee validation/xcodebuild.log

      - name: Build and test for iOS Simulator
        id: ios_unit
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'build-and-test') ||
          (github.event_name == 'push') ||
          (github.event_name == 'pull_request' &&
           github.head_ref != 'feat/pipo-ui-video-qa' &&
           github.head_ref != 'feat/pipo-onboarding-v4-interactions')
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoTestResults.xcresult" \
            -skip-testing:PipoUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build test 2>&1 | tee validation/xcodebuild.log

      - name: Verify App and Widget privacy manifest resources
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'feat/pipo-p0-auth-e2e-release-kit'
        shell: bash
        run: bash scripts/check-privacy-manifest.sh "$RUNNER_TEMP/PipoDerivedData"

      - name: Approved Card #44 Budget B visual and interaction QA
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-p1-card-parity-foundation'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoCardParityResults.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testApprovedBudgetBreakdownBOnGoalDetail \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/card-parity-qa.log

      - name: All eleven approved cards — one controlled iOS visual QA
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-p1-all-approved-cards'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoAllCardsQAResults.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testAllElevenApprovedCardFamilies \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/all-approved-cards-qa.log

      - name: Issue 42 — focused plan and money-out review-only simulator QA
        id: issue42
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'issue42-qa') ||
          (github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-42-reconciled-review-only')
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoIssue42ReviewQA.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testIssue42PlanAndMoneyOutRemainReviewOnly \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/pipo-issue42-review-qa.log

      - name: Approved Manage Plan V2 — interactive iPhone QA and MP4
        id: manage_plan
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'manage-plan-qa') ||
          (github.event_name == 'pull_request' &&
           (github.head_ref == 'feat/pipo-manage-plan-v2-option-b' ||
            github.head_ref == 'polish/pipo-dev2-manage-global-v1'))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 \
            validation/pipo-manage-plan-v2-qa.mp4 > validation/pipo-manage-v2-recording.log 2>&1 &
          VIDEO_PID=$!
          sleep 2
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoManagePlanV2QA.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testManagePlanV2OverviewFlexibleImpactReviewAndMoneyOutSafety \
            -only-testing:PipoUITests/PipoUIRecordingTests/testManagePlanV2TargetAndDateEditorsAreFocusedAndNonMutating \
            -only-testing:PipoUITests/PipoUIRecordingTests/testGlobalExperienceUSDGoalCurrencySelectionAndReopen \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/pipo-manage-v2-qa.log
          QA_STATUS=${PIPESTATUS[0]}
          set -e
          kill -INT "$VIDEO_PID" 2>/dev/null || true
          wait "$VIDEO_PID" 2>/dev/null || true
          test -s validation/pipo-manage-plan-v2-qa.mp4 || {
            echo "Manage Plan V2 MP4 missing or empty" >&2
            exit 1
          }
          exit "$QA_STATUS"

      - name: Global Experience V1 — onboarding and goal-currency integration QA
        id: global_v1
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'global-experience-qa') ||
          (github.event_name == 'pull_request' &&
           (github.head_ref == 'feat/pipo-global-experience-v1-currency' ||
            github.head_ref == 'integration/issue80-final-stability-qa-review'))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 \
            validation/pipo-global-experience-v1-qa.mp4 > validation/global-v1-recording.log 2>&1 &
          VIDEO_PID=$!
          sleep 2
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoGlobalExperienceV1QA.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testPostLoginPersonalizationAndWidgetPreview \
            -only-testing:PipoUITests/PipoUIRecordingTests/testGlobalExperienceUSDGoalCurrencySelectionAndReopen \
            -only-testing:PipoUITests/PipoUIRecordingTests/testGlobalV1AccessibilityLabelsAndTargetsAtLargeText \
            -only-testing:PipoUITests/PipoUIRecordingTests/testPersonalSavingJourney \
            -only-testing:PipoUITests/PipoUIRecordingTests/testManagePlanV2OverviewFlexibleImpactReviewAndMoneyOutSafety \
            -only-testing:PipoUITests/PipoUIRecordingTests/testManagePlanV2TargetAndDateEditorsAreFocusedAndNonMutating \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/pipo-global-experience-v1-qa.log
          QA_STATUS=${PIPESTATUS[0]}
          set -e
          kill -INT "$VIDEO_PID" 2>/dev/null || true
          wait "$VIDEO_PID" 2>/dev/null || true
          test -s validation/pipo-global-experience-v1-qa.mp4 || {
            echo "Global V1 MP4 missing or empty" >&2
            exit 1
          }
          exit "$QA_STATUS"

      - name: Approved Journey Wave A — focused native interaction QA and MP4
        id: journey_wave_a
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/journey-achievements-wave-a-20261123'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 \
            validation/pipo-journey-wave-a-qa.mp4 > validation/journey-wave-a-video.log 2>&1 &
          VIDEO_PID=$!
          cleanup() {
            kill -INT "$VIDEO_PID" 2>/dev/null || true
            wait "$VIDEO_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoJourneyWaveAQA.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testJourneyWaveAEmptyStatesAndRealHistory \
            -only-testing:PipoUITests/PipoUIRecordingTests/testReturningDashboardB \
            -only-testing:PipoUITests/PipoUIRecordingTests/testAllElevenApprovedCardFamilies \
            -only-testing:PipoUITests/PipoUIRecordingTests/testGlobalV1AccessibilityLabelsAndTargetsAtLargeText \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/pipo-journey-wave-a-qa.log
          QA_STATUS=$?
          set -e
          cleanup
          trap - EXIT
          test -s validation/pipo-journey-wave-a-qa.mp4 || {
            echo "Journey Wave A MP4 missing or empty" >&2
            exit 1
          }
          exit "$QA_STATUS"

      # Explicit owner-authorized one-batch proof. This is NEVER selected
      # automatically by a Draft PR synchronization or a review label.
      - name: Pipo cross-screen visual layout — manual simulator QA + MP4
        id: visual_layout
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'visual-layout-qa'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 \
            validation/pipo-cross-screen-visual-layout.mp4 > validation/visual-layout-video.log 2>&1 &
          VIDEO_PID=$!
          cleanup() {
            kill -INT "$VIDEO_PID" 2>/dev/null || true
            wait "$VIDEO_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoVisualLayoutQAResults.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:PipoUITests/PipoUIRecordingTests/testJourneyWaveAEmptyStatesAndRealHistory \
            -only-testing:PipoUITests/PipoUIRecordingTests/testManagePlanV2TargetAndDateEditorsAreFocusedAndNonMutating \
            -only-testing:PipoUITests/PipoUIRecordingTests/testManagePlanV2OverviewFlexibleImpactReviewAndMoneyOutSafety \
            -only-testing:PipoUITests/PipoUIRecordingTests/testAllElevenApprovedCardFamilies \
            -only-testing:PipoUITests/PipoUIRecordingTests/testGlobalV1AccessibilityLabelsAndTargetsAtLargeText \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/pipo-cross-screen-visual-layout.log
          QA_STATUS=${PIPESTATUS[0]}
          set -e
          cleanup
          trap - EXIT
          test -s validation/pipo-cross-screen-visual-layout.mp4 || {
            echo "Cross-screen visual layout MP4 missing or empty" >&2
            exit 1
          }
          exit "$QA_STATUS"

      - name: Issue 48 — goal detail photo hero focused native iOS QA
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-48-goal-photo-hero-v1'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoGoalPhotoHeroQA.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testIssue48GoalDetailHeroAndEmptyMediaSafety \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/pipo-48-hero-qa.log

      - name: Dashboard B — one controlled native iOS visual QA recording
        if: github.event_name == 'pull_request' && (github.head_ref == 'feat/pipo-dashboard-b' || github.head_ref == 'feat/pipo-p0-release-hardening')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          # Reuse the existing installed simulator and compiled build products.
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 \
            validation/pipo-dashboard-b-qa.mp4 > validation/dashboard-recording.log 2>&1 &
          VIDEO_PID=$!
          sleep 2
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoDashboardResults.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testReturningDashboardB \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/dashboard-b-qa.log
          TEST_RESULT=$?
          set -e
          kill -INT "$VIDEO_PID" 2>/dev/null || true
          wait "$VIDEO_PID" 2>/dev/null || true
          exit "$TEST_RESULT"

      - name: Dashboard B #18 — accessibility text-size simulator QA and MP4
        id: dashboard_a11y
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'dashboard-a11y-qa') ||
          (github.event_name == 'pull_request' && github.head_ref == 'fix/pipo-18-dashboard-metrics-a11y-v2')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 \
            validation/pipo-dashboard-a11y-qa.mp4 > validation/dashboard-a11y-recording.log 2>&1 &
          VIDEO_PID=$!
          sleep 2
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoDashboardAccessibilityQA.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testDashboardMetricCardsAtAccessibilityTextSize \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/pipo-dashboard-a11y-qa.log
          QA_STATUS=${PIPESTATUS[0]}
          set -e
          kill -INT "$VIDEO_PID" 2>/dev/null || true
          wait "$VIDEO_PID" 2>/dev/null || true
          test -s validation/pipo-dashboard-a11y-qa.mp4 || {
            echo "Dashboard accessibility QA MP4 missing or empty" >&2
            exit 1
          }
          exit "$QA_STATUS"

      - name: Issue 40 — first-saving persistence, error recovery and V4 celebration
        id: first_save
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'first-save-qa') ||
          (github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-40-first-save-activation')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 \
            validation/pipo-issue40-first-save-qa.mp4 > validation/first-save-recording.log 2>&1 &
          VIDEO_PID=$!
          sleep 2
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoFirstSaveQA.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testIssue40FirstSaveActivationSurvivesFailureAndRelaunch \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/pipo-issue40-first-save-qa.log
          QA_STATUS=${PIPESTATUS[0]}
          set -e
          kill -INT "$VIDEO_PID" 2>/dev/null || true
          wait "$VIDEO_PID" 2>/dev/null || true
          test -s validation/pipo-issue40-first-save-qa.mp4 || {
            echo "Issue 40 MP4 missing or empty" >&2
            exit 1
          }
          exit "$QA_STATUS"

      - name: Issue 69 — Spark per-goal Home/Detail screenshot and MP4 QA
        id: spark_goal
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'spark-goal-qa') ||
          (github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-69-per-goal-spark-integration')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 \
            validation/pipo-issue69-spark-goal-qa.mp4 > validation/spark-goal-recording.log 2>&1 &
          VIDEO_PID=$!
          sleep 2
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoSparkGoalQA.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testIssue69SparkPerGoalHomeFocusAndDetail \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/pipo-issue69-spark-goal-qa.log
          QA_STATUS=${PIPESTATUS[0]}
          set -e
          kill -INT "$VIDEO_PID" 2>/dev/null || true
          wait "$VIDEO_PID" 2>/dev/null || true
          test -s validation/pipo-issue69-spark-goal-qa.mp4 || {
            echo "Spark per-goal QA MP4 missing or empty" >&2
            exit 1
          }
          exit "$QA_STATUS"

      - name: P0 authentication and deletion simulator safety QA
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'feat/pipo-p0-live-auth-qa' ||
           github.head_ref == 'feat/pipo-p0-auth-e2e-release-kit')
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoAuthQAResults.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testP0AuthAndDeletionReviewGuards \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/p0-auth-deletion-ui-qa.log

      - name: Record native Saving journeys
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'visual-qa') ||
          (github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-ui-video-qa')
        shell: bash
        env:
          # Restrict setup-branch retries to Group; manual Visual QA still captures both.
          PIPO_VISUAL_QA_PR_RETRY: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-ui-video-qa' }}
        run: |
          set -euo pipefail
          mkdir -p validation
          bash scripts/record-ios-saving-journeys.sh 2>&1 | tee validation/visual-qa.log

      - name: Record V4 onboarding and both choice previews in one MP4
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'onboarding-qa') ||
          (github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-onboarding-v4-interactions')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          bash scripts/record-ios-onboarding.sh 2>&1 | tee validation/onboarding-qa.log

      - name: Export visual QA attachments
        if: always()
        shell: bash
        run: |
          for bundle in "$RUNNER_TEMP/PipoTestResults.xcresult" "$RUNNER_TEMP/PipoDashboardResults.xcresult" "$RUNNER_TEMP/PipoAuthQAResults.xcresult" "$RUNNER_TEMP/PipoCardParityResults.xcresult" "$RUNNER_TEMP/PipoAllCardsQAResults.xcresult" "$RUNNER_TEMP/PipoGoalPhotoHeroQA.xcresult" "$RUNNER_TEMP/PipoIssue42ReviewQA.xcresult" "$RUNNER_TEMP/PipoManagePlanV2QA.xcresult" "$RUNNER_TEMP/PipoGlobalExperienceV1QA.xcresult" "$RUNNER_TEMP/PipoDashboardAccessibilityQA.xcresult" "$RUNNER_TEMP/PipoFirstSaveQA.xcresult" "$RUNNER_TEMP/PipoSparkGoalQA.xcresult" "$RUNNER_TEMP/PipoJourneyWaveAQA.xcresult"; do
            if test -d "$bundle"; then
              name="$(basename "$bundle" .xcresult)"
              mkdir -p "validation/visual-qa/$name"
              xcrun xcresulttool export attachments \
                --path "$bundle" \
                --output-path "validation/visual-qa/$name" || echo "Attachment export unavailable for $name."
            fi
          done

      - name: Upload iOS validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.run_id }}
          path: |
            validation/
            xcode-version.txt
            ${{ runner.temp }}/PipoTestResults.xcresult
            ${{ runner.temp }}/PipoDashboardResults.xcresult
            ${{ runner.temp }}/PipoAuthQAResults.xcresult
            ${{ runner.temp }}/PipoCardParityResults.xcresult
            ${{ runner.temp }}/PipoAllCardsQAResults.xcresult
            ${{ runner.temp }}/PipoGoalPhotoHeroQA.xcresult
            ${{ runner.temp }}/PipoIssue42ReviewQA.xcresult
            ${{ runner.temp }}/PipoManagePlanV2QA.xcresult
            ${{ runner.temp }}/PipoGlobalExperienceV1QA.xcresult
            ${{ runner.temp }}/PipoDashboardAccessibilityQA.xcresult
            ${{ runner.temp }}/PipoFirstSaveQA.xcresult
            ${{ runner.temp }}/PipoSparkGoalQA.xcresult
            ${{ runner.temp }}/PipoJourneyWaveAQA.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Publish QA checkpoint summary
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATION_MODE: ${{ inputs.validation_mode || 'automatic-pr-or-tag' }}
          IOS_UNIT: ${{ steps.ios_unit.outcome }}
          ISSUE42: ${{ steps.issue42.outcome }}
          MANAGE_PLAN: ${{ steps.manage_plan.outcome }}
          GLOBAL_V1: ${{ steps.global_v1.outcome }}
          DASHBOARD_A11Y: ${{ steps.dashboard_a11y.outcome }}
          FIRST_SAVE: ${{ steps.first_save.outcome }}
          SPARK_GOAL: ${{ steps.spark_goal.outcome }}
          JOURNEY_WAVE_A: ${{ steps.journey_wave_a.outcome }}
        run: |
          {
            echo '## Pipo iOS QA checkpoint'
            echo "- Event: $EVENT_NAME"
            echo "- Validation mode: $VALIDATION_MODE"
            echo "- Commit under test: \`$TESTED_SHA\`"
            echo ''
            echo '| Check | Outcome |'
            echo '| --- | --- |'
            echo "| Base iOS build and unit tests | ${IOS_UNIT:-not-selected} |"
            echo "| Issue 42 focused simulator QA | ${ISSUE42:-not-selected} |"
            echo "| Manage Plan V2 focused simulator QA | ${MANAGE_PLAN:-not-selected} |"
            echo "| Global Experience V1 focused simulator QA | ${GLOBAL_V1:-not-selected} |"
            echo "| Dashboard B accessibility simulator QA | ${DASHBOARD_A11Y:-not-selected} |"
            echo "| Issue 40 first-saving activation simulator QA | ${FIRST_SAVE:-not-selected} |"
            echo "| Issue 69 Spark Home/Goal Detail simulator QA | ${SPARK_GOAL:-not-selected} |"
            echo "| Approved Journey Wave A simulator QA | ${JOURNEY_WAVE_A:-not-selected} |"
            echo ''
            echo 'A skipped focused suite was not executed, and does not count as QA evidence.'
            echo 'Manual focused QA is supplemental; required PR checks still apply before merge.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Gate an explicitly authorized one-time macOS QA on PR #83's DRAFT
  # integration snapshot. Must be applied by human-visible label event;
  # never starts macOS simply because a draft branch is synchronized.
  issue80-integrated-qa:
    name: "Issue #80: controlled native QA (draft #83 only)"
    if: >-
      false # Owner-paused: legacy label-triggered paid macOS QA is disabled
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head (not synthetic merge commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Pin QA SHA and available Xcode, never change project Release flags
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p validation
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'PR #83 exact native QA SHA: %s\n' "$EXPECTED_SHA" | tee validation/issue80-native-head.txt
          if test -d /Applications/Xcode.app/Contents/Developer; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version | tee validation/issue80-xcode-version.txt
          bash scripts/check-p0-release-config.sh
          test -d Pipo.xcodeproj
          test -d PipoTests
          test -f PipoUITests/PipoUIRecordingTests.swift
          # CI defines this flag in a single Debug command below, never in
          # project.pbxproj or product build configurations.
          ! grep -q 'PIPO_ISSUE80_STAGING' Pipo.xcodeproj/project.pbxproj

      - name: Select an already installed iPhone simulator (no runtime downloads)
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available -j > validation/issue80-runtimes.json
          xcrun simctl list devices available -j > validation/issue80-devices.json
          python3 - <<'PY'
          import json, os
          runtime_ids = {r['identifier'] for r in
                         json.load(open('validation/issue80-runtimes.json'))['runtimes']
                         if r.get('isAvailable') and r.get('name','').startswith('iOS ')}
          all_devices = json.load(open('validation/issue80-devices.json'))['devices']
          candidates = [(0 if d['name'] in ('iPhone 15','iPhone 16','iPhone 14') else 1,
                         d['name'], d['udid'])
                        for runtime, devices in all_devices.items()
                        if runtime in runtime_ids for d in devices
                        if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No installed iOS/iPhone simulator, fail closed')
          _, name, udid = sorted(candidates)[0]
          print(f'Native QA simulator: {name} ({udid})')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PIPO_IOS_QA_UDID='+udid+'\n')
          PY

      - name: SwiftData + native unit tests (Debug-only staging contract compilation)
        id: issue80_native
        if: github.event.label.name == 'enhancement'
        shell: bash
        run: |
          set -euo pipefail
          # Do NOT pass SWIFT_ACTIVE_COMPILATION_CONDITIONS on the xcodebuild
          # command line: that pollutes swift-crypto's SPM targets and caused
          # a CCryptoBoringSSL module-not-found failure in the first run.
          # Scope the QA define only to THIS Xcode project's Debug config in
          # this ephemeral runner. Both the repository and Release remain
          # unchanged; undo the patch before normal Debug UI tests.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Pipo.xcodeproj/project.pbxproj")
          body = path.read_text()
          original = 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = "DEBUG $(inherited)";'
          assert body.count(original) == 1, "Expected exactly one Debug project config"
          scoped = 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = "DEBUG PIPO_ISSUE80_STAGING $(inherited)";'
          path.write_text(body.replace(original, scoped, 1))
          PY
          trap 'git checkout -- Pipo.xcodeproj/project.pbxproj' EXIT
          xcodebuild \
            -project Pipo.xcodeproj \
            -scheme Pipo \
            -configuration Debug \
            -destination "id=$PIPO_IOS_QA_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoIssue80DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoIssue80Native.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:PipoTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/issue80-native-unit.log
          # Native test must be present; a green no-tests run is invalid.
          grep -q 'testIssue80PersistedFirstGoalReconcilesWithoutChangingSavingOrXP' \
            validation/issue80-native-unit.log || {
              echo 'Issue 80 native SwiftData test did not execute' >&2
              exit 1
            }

      - name: Integrated UI review-only regression + MP4 (normal Debug, staging OFF)
        id: issue80_ui
        if: github.event.label.name == 'enhancement'
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$PIPO_IOS_QA_UDID" || true
          xcrun simctl bootstatus "$PIPO_IOS_QA_UDID" -b
          xcrun simctl io "$PIPO_IOS_QA_UDID" recordVideo --codec=h264 \
            validation/issue80-integrated-ui.mp4 > validation/issue80-video.log 2>&1 &
          VIDEO_PID=$!
          cleanup() {
            kill -INT "$VIDEO_PID" 2>/dev/null || true
            wait "$VIDEO_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          set +e
          xcodebuild \
            -project Pipo.xcodeproj \
            -scheme Pipo \
            -configuration Debug \
            -destination "id=$PIPO_IOS_QA_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoIssue80DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoIssue80UI.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:PipoUITests/PipoUIRecordingTests/testManagePlanV2OverviewFlexibleImpactReviewAndMoneyOutSafety \
            -only-testing:PipoUITests/PipoUIRecordingTests/testManagePlanV2TargetAndDateEditorsAreFocusedAndNonMutating \
            -only-testing:PipoUITests/PipoUIRecordingTests/testGlobalExperienceUSDGoalCurrencySelectionAndReopen \
            -only-testing:PipoUITests/PipoUIRecordingTests/testGlobalV1AccessibilityLabelsAndTargetsAtLargeText \
            -only-testing:PipoUITests/PipoUIRecordingTests/testIssue42PlanAndMoneyOutRemainReviewOnly \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/issue80-integrated-ui.log
          STATUS=${PIPESTATUS[0]}
          set -e
          cleanup
          trap - EXIT
          test -s validation/issue80-integrated-ui.mp4 || {
            echo 'Integrated simulator recording is empty/missing' >&2
            exit 1
          }
          exit "$STATUS"

      - name: Retest only the pinned-footer Money Out UI regression + MP4
        id: issue80_ui_retest
        if: github.event.label.name == 'bug'
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$PIPO_IOS_QA_UDID" || true
          xcrun simctl bootstatus "$PIPO_IOS_QA_UDID" -b
          xcrun simctl io "$PIPO_IOS_QA_UDID" recordVideo --codec=h264 \
            validation/issue80-money-out-retest.mp4 > validation/issue80-money-out-video.log 2>&1 &
          VIDEO_PID=$!
          cleanup() {
            kill -INT "$VIDEO_PID" 2>/dev/null || true
            wait "$VIDEO_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          set +e
          xcodebuild \
            -project Pipo.xcodeproj \
            -scheme Pipo \
            -configuration Debug \
            -destination "id=$PIPO_IOS_QA_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoIssue80DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoIssue80MoneyOutRetest.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:PipoUITests/PipoUIRecordingTests/testIssue42PlanAndMoneyOutRemainReviewOnly \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/issue80-money-out-retest.log
          STATUS=${PIPESTATUS[0]}
          set -e
          cleanup
          trap - EXIT
          test -s validation/issue80-money-out-retest.mp4 || {
            echo 'Focused Money Out simulator recording is empty/missing' >&2
            exit 1
          }
          exit "$STATUS"

      - name: Export screenshots/attachments from native XCTest results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for name in PipoIssue80Native PipoIssue80UI PipoIssue80MoneyOutRetest; do
            bundle="$RUNNER_TEMP/$name.xcresult"
            if test -d "$bundle"; then
              mkdir -p "validation/issue80-attachments/$name"
              xcrun xcresulttool export attachments --path "$bundle" \
                --output-path "validation/issue80-attachments/$name" || true
            fi
          done

      - name: Upload native QA evidence (7 day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue80-pr83-native-qa-${{ github.run_id }}
          path: |
            validation/
            ${{ runner.temp }}/PipoIssue80Native.xcresult
            ${{ runner.temp }}/PipoIssue80UI.xcresult
            ${{ runner.temp }}/PipoIssue80MoneyOutRetest.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Publish exact-head native gate summary
        if: always()
        shell: bash
        env:
          QA_SHA: ${{ github.event.pull_request.head.sha }}
          NATIVE: ${{ steps.issue80_native.outcome }}
          UI: ${{ steps.issue80_ui.outcome }}
          UI_RETEST: ${{ steps.issue80_ui_retest.outcome }}
        run: |
          {
            echo '## Pipo PR #83 one-time macOS native QA'
            echo "- Exact SHA: $QA_SHA"
            echo "- Debug-only staging native XCTest: $NATIVE"
            echo "- Production-like Debug UI review-only regression: $UI"
            echo "- Focused Money Out UI retry: $UI_RETEST"
            echo '- No live Supabase schema changes, no merge, no Release staging flag.'
            echo '- Skipped or failed tests never count as acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Explicit owner-authorized single native QA. Synchronize on draft does not
  # start Mac minutes; Release settings are never changed in the repository.
  issue80-legacy-bridge-native:
    name: "Issue #80: native legacy bridge QA (draft #85 only)"
    if: false # Owner-paused: legacy draft #85 macOS label-triggered QA is disabled
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Pin SHA and Xcode + select installed simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -d Pipo.xcodeproj
          ! grep -q 'PIPO_ISSUE80_BRIDGE' Pipo.xcodeproj/project.pbxproj
          if test -d /Applications/Xcode.app/Contents/Developer; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version | tee validation/issue80-bridge-xcode-version.txt
          bash scripts/check-p0-release-config.sh
          xcrun simctl list runtimes available -j > validation/bridge-runtimes.json
          xcrun simctl list devices available -j > validation/bridge-devices.json
          python3 - <<'PY'
          import json, os
          rt=json.load(open('validation/bridge-runtimes.json'))['runtimes']
          valid={r['identifier'] for r in rt
                 if r.get('isAvailable') and r.get('name','').startswith('iOS ')}
          all_devices=json.load(open('validation/bridge-devices.json'))['devices']
          found=[(0 if d['name'] in ('iPhone 15','iPhone 16') else 1,d['udid'])
                 for runtime,devices in all_devices.items() if runtime in valid
                 for d in devices
                 if d.get('isAvailable') and d.get('name','').startswith('iPhone')]
          if not found: raise SystemExit('No installed simulator. Refusing download.')
          sim=sorted(found)[0][1]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PIPO_BRIDGE_UDID='+sim+'\n')
          print('Pinned simulator '+sim)
          PY

      - name: Native bridge build + XCTest (Debug flag isolated to app)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Pipo.xcodeproj/project.pbxproj')
          body=p.read_text()
          needle='SWIFT_ACTIVE_COMPILATION_CONDITIONS = "DEBUG $(inherited)";'
          assert body.count(needle)==1, 'Unexpected project Debug configuration'
          p.write_text(body.replace(
              needle,
              'SWIFT_ACTIVE_COMPILATION_CONDITIONS = "DEBUG PIPO_ISSUE80_BRIDGE $(inherited)";',1))
          PY
          trap 'git checkout -- Pipo.xcodeproj/project.pbxproj' EXIT
          xcodebuild \
            -project Pipo.xcodeproj -scheme Pipo -configuration Debug \
            -destination "id=$PIPO_BRIDGE_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoBridgeDerived" \
            -resultBundlePath "$RUNNER_TEMP/PipoBridgeNative.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:PipoTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/issue80-bridge-native.log
          grep -q 'testIssue80LegacyBridgeKeepsLocalSavingAndXPOnReopen' \
            validation/issue80-bridge-native.log || {
              echo 'Bridge native SwiftData/XCTest case was not executed' >&2
              exit 1
            }
          grep -Eq 'Test Suite|Executed [1-9][0-9]* tests?' \
            validation/issue80-bridge-native.log

      - name: Preserve QA logs and xcresult (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue80-pr85-bridge-native-${{ github.run_id }}
          path: |
            validation/
            ${{ runner.temp }}/PipoBridgeNative.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Report pinned native gate
        if: always()
        run: |
          {
            echo '## Review-only bridge Xcode QA'
            echo '- Exact SHA: ${{ github.event.pull_request.head.sha }}'
            echo '- Debug-only bridge flag; no Release, signing, database or merge change'
            echo '- Native QA job status: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"
