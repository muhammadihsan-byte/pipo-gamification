name: iOS Build and Test

on:
  pull_request:
    branches:
      - main
      - preview/pipo-v4-home
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "Choose fast compilation or full simulator tests"
        type: choice
        required: true
        default: build-only
        options:
          - build-only
          - build-and-test
          - visual-qa
          - onboarding-qa
  push:
    tags:
      - "v*-rc*"

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Xcode
        run: |
          set -euo pipefail
          if test -d /Applications/Xcode.app/Contents/Developer; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          DEVELOPER_DIR="$(xcode-select -p 2>/dev/null || true)"
          if test -z "$DEVELOPER_DIR" || ! test -d "$DEVELOPER_DIR"; then
            echo "No usable Xcode developer directory is available." >&2
            exit 1
          fi
          xcodebuild -version | tee xcode-version.txt

      - name: Detect canonical Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if test -d Pipo.xcodeproj; then
            XCODE_PROJECT="Pipo.xcodeproj"
            XCODE_SCHEME="Pipo"
          elif test -d SatuSaku.xcodeproj; then
            XCODE_PROJECT="SatuSaku.xcodeproj"
            XCODE_SCHEME="SatuSaku"
          else
            echo "Neither Pipo.xcodeproj nor SatuSaku.xcodeproj is available." >&2
            exit 1
          fi
          {
            echo "XCODE_PROJECT=$XCODE_PROJECT"
            echo "XCODE_SCHEME=$XCODE_SCHEME"
          } >> "$GITHUB_ENV"
          echo "Using project $XCODE_PROJECT with scheme $XCODE_SCHEME"

      - name: P0 static release configuration preflight
        shell: bash
        run: bash scripts/check-p0-release-config.sh

      - name: Select a compatible installed iOS simulator
        if: github.event_name != 'workflow_dispatch' || inputs.validation_mode != 'build-only'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcrun simctl list runtimes available -j > validation/runtimes.json
          xcrun simctl list devices available -j > validation/devices.json
          python3 - <<'PY'
          import json
          import os
          import sys

          with open("validation/runtimes.json") as file:
              runtimes = json.load(file).get("runtimes", [])
          with open("validation/devices.json") as file:
              devices_by_runtime = json.load(file).get("devices", {})

          available_runtimes = {
              runtime["identifier"]
              for runtime in runtimes
              if (
                  runtime.get("isAvailable")
                  and runtime.get("name", "").startswith("iOS ")
                  and ".iOS-" in runtime.get("identifier", "")
              )
          }
          if not available_runtimes:
              raise SystemExit(
                  "No available iOS simulator runtime is installed; "
                  "refusing to provision one."
              )

          preferred_names = ("iPhone 15", "iPhone 16", "iPhone 14", "iPhone 13")
          candidates = []
          for runtime_id, devices in devices_by_runtime.items():
              if runtime_id not in available_runtimes:
                  continue
              for device in devices:
                  if (
                      device.get("isAvailable")
                      and not device.get("availabilityError")
                      and device.get("name", "").startswith("iPhone")
                  ):
                      preference = next(
                          (
                              index
                              for index, name in enumerate(preferred_names)
                              if device["name"] == name
                          ),
                          len(preferred_names),
                      )
                      candidates.append((preference, device["name"], runtime_id, device["udid"]))

          if not candidates:
              raise SystemExit(
                  "No available iPhone simulator matches an installed iOS runtime; "
                  "refusing to create or install one."
              )

          _, name, runtime_id, udid = sorted(candidates)[0]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIMULATOR_NAME={name}\n")
              env.write(f"SIMULATOR_RUNTIME_ID={runtime_id}\n")
              env.write(f"SIMULATOR_UDID={udid}\n")
          print(f"Using existing simulator: {name} ({udid}) on {runtime_id}")
          PY

      - name: Build only for iOS Simulator
        if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'build-only'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee validation/xcodebuild.log

      - name: Build and test for iOS Simulator
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'build-and-test') ||
          (github.event_name == 'push') ||
          (github.event_name == 'pull_request' &&
           github.head_ref != 'feat/pipo-ui-video-qa' &&
           github.head_ref != 'feat/pipo-onboarding-v4-interactions')
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoTestResults.xcresult" \
            -skip-testing:PipoUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build test 2>&1 | tee validation/xcodebuild.log

      - name: Verify App and Widget privacy manifest resources
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'feat/pipo-p0-auth-e2e-release-kit'
        shell: bash
        run: bash scripts/check-privacy-manifest.sh "$RUNNER_TEMP/PipoDerivedData"

      - name: Dashboard B — one controlled native iOS visual QA recording
        if: github.event_name == 'pull_request' && (github.head_ref == 'feat/pipo-dashboard-b' || github.head_ref == 'feat/pipo-p0-release-hardening')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          # Reuse the existing installed simulator and compiled build products.
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 \
            validation/pipo-dashboard-b-qa.mp4 > validation/dashboard-recording.log 2>&1 &
          VIDEO_PID=$!
          sleep 2
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoDashboardResults.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testReturningDashboardB \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/dashboard-b-qa.log
          TEST_RESULT=$?
          set -e
          kill -INT "$VIDEO_PID" 2>/dev/null || true
          wait "$VIDEO_PID" 2>/dev/null || true
          exit "$TEST_RESULT"

      - name: P0 authentication and deletion simulator safety QA
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'feat/pipo-p0-live-auth-qa' ||
           github.head_ref == 'feat/pipo-p0-auth-e2e-release-kit')
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PipoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PipoAuthQAResults.xcresult" \
            -only-testing:PipoUITests/PipoUIRecordingTests/testP0AuthAndDeletionReviewGuards \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee validation/p0-auth-deletion-ui-qa.log

      - name: Record native Saving journeys
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'visual-qa') ||
          (github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-ui-video-qa')
        shell: bash
        env:
          # Restrict setup-branch retries to Group; manual Visual QA still captures both.
          PIPO_VISUAL_QA_PR_RETRY: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-ui-video-qa' }}
        run: |
          set -euo pipefail
          mkdir -p validation
          bash scripts/record-ios-saving-journeys.sh 2>&1 | tee validation/visual-qa.log

      - name: Record V4 onboarding and both choice previews in one MP4
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'onboarding-qa') ||
          (github.event_name == 'pull_request' && github.head_ref == 'feat/pipo-onboarding-v4-interactions')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          bash scripts/record-ios-onboarding.sh 2>&1 | tee validation/onboarding-qa.log

      - name: Export visual QA attachments
        if: always()
        shell: bash
        run: |
          for bundle in "$RUNNER_TEMP/PipoTestResults.xcresult" "$RUNNER_TEMP/PipoDashboardResults.xcresult" "$RUNNER_TEMP/PipoAuthQAResults.xcresult"; do
            if test -d "$bundle"; then
              name="$(basename "$bundle" .xcresult)"
              mkdir -p "validation/visual-qa/$name"
              xcrun xcresulttool export attachments \
                --path "$bundle" \
                --output-path "validation/visual-qa/$name" || echo "Attachment export unavailable for $name."
            fi
          done

      - name: Upload iOS validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.run_id }}
          path: |
            validation/
            xcode-version.txt
            ${{ runner.temp }}/PipoTestResults.xcresult
            ${{ runner.temp }}/PipoDashboardResults.xcresult
            ${{ runner.temp }}/PipoAuthQAResults.xcresult
          if-no-files-found: warn
          retention-days: 7
