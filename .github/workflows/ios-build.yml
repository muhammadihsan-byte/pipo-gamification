name: iOS Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build and test for iOS Simulator
        shell: bash
        run: |
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-18-5
          if ! xcrun simctl list runtimes -j | jq -e --arg runtime "$runtime" \
            '.runtimes | any(.identifier == $runtime and .isAvailable)' > /dev/null; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.5
          fi
          simulator_id=$(xcrun simctl create 'Pipo CI iPhone 16' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          xcodebuild \
            -scheme Pipo \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_REQUIRED=NO \
            build test
